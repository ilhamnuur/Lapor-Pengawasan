# Docker Chrome berbasis Kasm (KasmVNC).
#
# Yang dijalankan adalah Chrome "berbentuk desktop" yang diakses lewat
# browser lain pada:
#
#     http://<IP-server>:5678    (nginx -> KasmVNC, tanpa peringatan sertifikat)
#     https://<IP-server>:5679   (langsung KasmVNC, terenkripsi)
#
# Login: user `kasm_user`, password diambil dari `KASM_VNC_PW` (.env).
#
# KasmVNC hanya menerima HTTPS. Service `web` (nginx) di depan port 5678
# meneruskan HTTP ke KasmVNC memakai HTTPS di jaringan internal Docker,
# sehingga pengguna tidak perlu menembus peringatan sertifikat self-signed.
#
# Pemakaian:
#   docker compose -f docker-compose.kasm-chrome.yml up -d
#   docker compose -f docker-compose.kasm-chrome.yml logs -f
#   docker compose -f docker-compose.kasm-chrome.yml down
#
# Panduan lengkap: docs/DOCKER-KASM-CHROME.md

# Project Compose terpisah agar tidak dianggap "orphan" oleh project
# aplikasi (docker-compose.yml) dan aman dari `down --remove-orphans`.
name: kasm-chrome

services:
  kasm-chrome:
    # Pin versi agar update tidak terjadi tanpa sengaja.
    # Cek tag terbaru: https://hub.docker.com/r/kasmweb/chrome/tags
    image: kasmweb/chrome:1.18.0
    container_name: kasm-chrome
    restart: unless-stopped

    # Chrome butuh /dev/shm yang cukup. Terlalu kecil = tab sering crash.
    shm_size: "1gb"

    environment:
      TZ: ${TZ:-Asia/Jakarta}
      # Wajib. Minimal 6 karakter. Ganti sebelum deploy!
      VNC_PW: ${KASM_VNC_PW:?isi KASM_VNC_PW di .env (minimal 6 karakter)}
      VNC_RESOLUTION: ${KASM_VNC_RESOLUTION:-1280x800}
      # Halaman yang dibuka saat Chrome pertama kali start.
      LAUNCH_URL: ${KASM_LAUNCH_URL:-https://www.google.com}
      # Argumen tambahan untuk Chrome.
      APP_ARGS: ${KASM_APP_ARGS:---start-maximized}
      # Batasi dialog upload/save file ke folder home user container.
      KASM_RESTRICTED_FILE_CHOOSER: "true"

    # DNS internal BPS. Tanpa ini, domain seperti fasih-sm.bps.go.id
    # hanya ter-resolve lewat DNS publik (CNAME tanpa A record) dan gagal.
    # 10.10.11.11/12 juga meneruskan query domain publik.
    dns:
      - ${KASM_DNS_1:-10.10.11.11}
      - ${KASM_DNS_2:-10.10.11.12}

    ports:
      # HTTPS langsung ke KasmVNC (opsional, untuk akses terenkripsi).
      # Sertifikatnya self-signed, jadi browser akan menampilkan peringatan.
      - "${KASM_CHROME_HTTPS_BIND:-0.0.0.0}:${KASM_CHROME_HTTPS_PORT:-5679}:6901"

    healthcheck:
      # Cek port KasmVNC sudah menerima koneksi (tanpa perlu curl).
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6901' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    # Profil browser (login, bookmark, cookie, setting) disimpan di volume
    # agar tidak hilang saat container dibuat ulang. Cookie ini juga membantu
    # situs ber-WAF (mis. fasih-sm.bps.go.id) mengingat sesi yang sudah lolos
    # verifikasi.
    volumes:
      - kasm-chrome-home:/home/kasm-user
      # Folder tukar file. Di Chrome Kasm muncul sebagai folder Downloads;
      # di server isinya ada di /home/bps/kasm-chrome/shared.
      - /home/bps/kasm-chrome/shared:/home/kasm-user/Downloads

    # Catatan: setelah ganti tag image, hapus volume bila profil terasa
    # bermasalah (`docker volume rm kasm-chrome_kasm-chrome-home`).

    deploy:
      resources:
        limits:
          # Chrome bisa rakus RAM. Naikkan bila sering kehabisan memori.
          memory: ${KASM_CHROME_MEMORY:-2g}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Reverse proxy HTTP -> KasmVNC (HTTPS di jaringan internal).
    # Inilah yang membuat http://<server>:5678 bisa dibuka tanpa
    # peringatan sertifikat self-signed.
    image: nginx:1.27-alpine
    container_name: kasm-chrome-web
    restart: unless-stopped
    depends_on:
      kasm-chrome:
        condition: service_healthy
    ports:
      - "${KASM_CHROME_BIND:-0.0.0.0}:${KASM_CHROME_PORT:-5678}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kasm-chrome-home:
